services:
  - type: web
    name: etude-math-pro
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mathprof-db
          property: connectionString
      - key: ENVIRONMENT
        value: production

databases:
  - name: mathprof-db
    databaseName: mathprof
    user: mathprof_user
    plan: free
